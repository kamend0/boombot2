[project]
name = "boombot"
version = "0.1.0"
description = "Discord bot that announces voice-channel joins and plays sounds."
requires-python = ">=3.14"
dependencies = [
    "discord.py[voice]>=2.4.0",
    "gTTS>=2.5.0",
    "boto3>=1.34.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/boombot"]
